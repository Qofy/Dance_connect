[package]
name = "danceconnect-backend"
version = "4.26.300"
edition = "2021"
description = "Mitote Backend Server with database tools and API"
build = "build.rs"

[dependencies]
# Web framework and CORS
actix-web = { version = "4.4", default-features = false, features = ["macros"] }
actix-cors = { version = "0.7.1", default-features = false, features = [] }

axum = { version = "0.7", features = ["multipart", "json"] }

tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
rust_decimal = "1.36"
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
bytes = "1"

sled = "0.34"
bincode = "1.3"
deadpool-postgres = "0.14.1"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
refinery = { version = "0.8", features = ["tokio-postgres"] }

# Async runtime
tokio = { version = "1.37", features = ["full"] }

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
regex = "1.10"
actix-http = "3.11.2"
actix-files = { version = "0.6.8", features = ["actix-server"] }
ron = "0.11.0"
flate2 = "1.1.5"
tar = "0.4.44"
aes-gcm = "0.10.3"

# Process management (Unix signals)
[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["signal"] }

# Date/Time
chrono = { version = "0.4", features = ["serde", "clock"] }
time = { version = "0.3", features = ["formatting"] }

# Configuration and environment
dotenvy = "0.15"

# HTTP client for payment APIs and crawler
reqwest = { version = "0.11", features = ["json", "gzip", "brotli", "cookies"] }
urlencoding = "2.1"
url = "2.5"

# HTML parsing for crawler
scraper = "0.20"
select = "0.6"

# QR Code generation
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# PDF/image manipulation
lopdf = { version = "0.27", features = ["embed_image"] }
printpdf = { version = "0.7", features = ["embedded_images"] }
pdf-writer = "0.9"
imageproc = "0.25"
ab_glyph = "0.2"
resvg = "0.42"
usvg = "0.42"

# TOTP for MFA
totp-rs = "5.4"
rand = "0.8"

# CLI argument parsing
clap = { version = "4.4", features = ["derive", "env"] }

# Enhanced logging
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "chrono", "ansi"] }
tracing-log = "0.2"
colored = "3"
env_logger = "0.11.8"
serde_yaml = "0.9"

# Error handling
anyhow = "1.0"
md5 = { version = "0.7", default-features = false, features = [] }

# Login Password hashing
once_cell = "1.19"
which = "8"
atty = "0.2"
argon2 = "0.5"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
parking_lot = "0.12"


# JWT for authentication
# rand_core = { version = "0.9.3", default-features = false, features = ["os_rng", "serde", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# pasetors = { version = "0.7.7", default-features = false, features = ["v4", "std"] }
pasetors = { version = "0.6", default-features = false, features = ["v4", "std"] }
nanoid = "0.4.0"

# rand_core = { version = "0.9.3", default-features = false, features = ["os_rng", "serde", "std"] }
# pasetors = { version = "0.7.7", default-features = false, features = ["v4", "std"] }

# Development dependencies
[dev-dependencies]
tokio-test = "0.4"
serial_test = "3.0"
temp-env = "0.3"
tempfile = "3.8"

[build-dependencies]
# vergen = { version = "9.0.6", features = ["build", "cargo", "emit_and_set", "rustc", "rustc_version", "sysinfo"] }
vergen = { version = "8.0", features = ["build", "cargo", "git", "gitcl"] }
glob = "0.3"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
serde_json = "1.0"
chrono = "0.4"

[features]
default = []
ocr = []



# Cargo.toml
[profile.release]
opt-level = "z"         # optimize for size
lto = "thin"            #  "thin" or "fat" for a tiny bit smaller, slower link
codegen-units = 16
panic = "abort"
strip = "symbols"       # Rust 1.70+

[profile.release.package."*"]
debug = false
